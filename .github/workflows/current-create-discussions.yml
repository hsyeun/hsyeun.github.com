name: Create Giscus Discussions for All Posts
on:
  workflow_dispatch:  # 수동 실행

jobs:
  create-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find all posts
        run: |
          echo "ALL_FILES=$(find _posts -type f -name '*.md' | tr '\n' ' ')" >> $GITHUB_ENV
          echo "Detected files: $ALL_FILES"

      - name: Create discussions for all posts
        env:
          GISCUS_TOKEN: ${{ secrets.GISCUS_TOKEN }}
          REPO_OWNER: hsyeun
          REPO_NAME: hsyeun/hsyeun.github.com
          CATEGORY_ID: DIC_kwDOFrWUIM4CwrDl
        run: |
          for FILE in $ALL_FILES; do
            FILENAME=$(basename "$FILE" .md)
            DATE=$(echo "$FILENAME" | cut -d'-' -f1-3)
            SLUG=$(echo "$FILENAME" | cut -d'-' -f4-)
            PATHNAME="/frontend/${DATE//-//}/${SLUG}/"

            echo "Creating Discussion for $PATHNAME"

            QUERY=$(jq -n \
              --arg owner "$REPO_OWNER" \
              --arg name "$REPO_NAME" \
              --arg cat "$CATEGORY_ID" \
              --arg title "$PATHNAME" \
              '{
                query: "mutation ($owner: String!, $name: String!, $cat: ID!, $title: String!) { createDiscussion(input: {repositoryId: repository(owner: $owner, name: $name) {id}, categoryId: $cat, title: $title, body: \"Auto-created for existing blog post.\"}) { discussion { id title url } } }",
                variables: { owner: $owner, name: $name, cat: $cat, title: $title }
              }'
            )

            curl -s -o response.json -w "%{http_code}\n" \
              -H "Authorization: bearer $GISCUS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$CREATE_QUERY" \
              https://api.github.com/graphql

            cat response.json
          done