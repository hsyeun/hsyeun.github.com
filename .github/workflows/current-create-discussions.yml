name: Create Giscus Discussions for All Posts
on:
  workflow_dispatch:  # 수동 실행

jobs:
  create-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find all posts
        run: |
          echo "ALL_FILES=$(find _posts -type f -name '*.md' | tr '\n' ' ')" >> $GITHUB_ENV
          echo "Detected files: $ALL_FILES"

      - name: Create discussions for all posts
        env:
          GISCUS_TOKEN: ${{ secrets.GISCUS_TOKEN }}
          REPO_OWNER: hsyeun
          REPO_NAME: hsyeun.github.com
          CATEGORY_ID: DIC_kwDOFrWUIM4CwrDl
        run: |
          for FILE in $ALL_FILES; do
            FILENAME=$(basename "$FILE" .md)
            DATE=$(echo "$FILENAME" | cut -d'-' -f1-3)
            SLUG=$(echo "$FILENAME" | cut -d'-' -f4-)
            PATHNAME="/${DATE//-//}/${SLUG}/"

            echo "Creating Discussion for $PATHNAME"

            REPO_ID=$(curl -s -H "Authorization: bearer $GISCUS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\": \"query { repository(owner: \\\"$REPO_OWNER\\\", name: \\\"$REPO_NAME\\\") { id } }\"}" \
              https://api.github.com/graphql | jq -r ".data.repository.id")

            echo "Repository ID: $REPO_ID"

            CREATE_BODY="{\"query\": \"mutation { createDiscussion(input: {repositoryId: \\\"$REPO_ID\\\", categoryId: \\\"$CATEGORY_ID\\\", title: \\\"$PATHNAME\\\", body: \\\"Auto-created for existing blog post.\\\"}) { discussion { id title url } } }\"}"

            curl -s -o response.json -w "%{http_code}\n" \
              -H "Authorization: bearer $GISCUS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$CREATE_BODY" \
              https://api.github.com/graphql

            echo "Response:"
            cat response.json
            echo "--------------------------------------"
          done