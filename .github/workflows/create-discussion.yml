name: Create Giscus Discussion
on:
  push:
    branches: [ main ]
    paths:
      - '_posts/**'   # 새 블로그 글 추가 시만 동작

jobs:
  create-discussion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract new post filenames
        id: files
        run: |
          git fetch origin main
          echo "NEW_FILES=$(git diff --name-only HEAD~1 HEAD | grep '_posts/' || true)" >> $GITHUB_ENV

      - name: Create discussions for new posts
        if: env.NEW_FILES != ''
        env:
          GISCUS_TOKEN: ${{ secrets.GISCUS_TOKEN }}
          REPO_OWNER: hsyeun
          REPO_NAME: hsyeun/hsyeun.github.com
          CATEGORY_ID: DIC_kwDOFrWUIM4CwrDl
        run: |
          for FILE in $NEW_FILES; do
            FILENAME=$(basename "$FILE" .md)
            DATE=$(echo "$FILENAME" | cut -d'-' -f1-3)
            SLUG=$(echo "$FILENAME" | cut -d'-' -f4-)
            PATHNAME="/frontend/${DATE//-//}/${SLUG}/"

            echo "Creating Discussion for $PATHNAME"

            QUERY=$(jq -n \
              --arg owner "$REPO_OWNER" \
              --arg name "$REPO_NAME" \
              --arg cat "$CATEGORY_ID" \
              --arg title "$PATHNAME" \
              '{
                query: "mutation ($owner: String!, $name: String!, $cat: ID!, $title: String!) { createDiscussion(input: {repositoryId: repository(owner: $owner, name: $name) {id}, categoryId: $cat, title: $title, body: \"Auto-created for new blog post.\"}) { discussion { id title url } } }",
                variables: { owner: $owner, name: $name, cat: $cat, title: $title }
              }'
            )

            curl -X POST \
              -H "Authorization: bearer $GISCUS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$QUERY" \
              https://api.github.com/graphql
          done