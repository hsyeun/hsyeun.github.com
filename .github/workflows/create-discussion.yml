name: Create Giscus Discussion
on:
  push:
    branches: [ branch ]
    paths:
      - '_posts/**/**'

jobs:
  create-discussion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract new post filenames
        id: files
        run: |
          git fetch origin main
          echo "NEW_FILES=$(git diff --name-only HEAD~1 HEAD | grep '_posts/' || true)" >> $GITHUB_ENV

      - name: Create discussions for new posts
        if: env.NEW_FILES != ''
        env:
          GISCUS_TOKEN: ${{ secrets.GISCUS_TOKEN }}
          REPO_OWNER: hsyeun
          REPO_NAME: hsyeun/hsyeun.github.com
          CATEGORY_ID: DIC_kwDOFrWUIM4CwrDl
        run: |
          for FILE in $NEW_FILES; do
            FILENAME=$(basename "$FILE" .md)
            DATE=$(echo "$FILENAME" | cut -d'-' -f1-3)
            SLUG=$(echo "$FILENAME" | cut -d'-' -f4-)

            CATEGORY=$(grep -m1 '^categories:' "$FILE" | awk '{print $2}')
            if [ -z "$CATEGORY" ]; then
              CATEGORY="uncategorized"
            fi

            PATHNAME="/${CATEGORY}/${DATE//-//}/${SLUG}"

            echo "Creating Discussion for $PATHNAME"

            REPO_ID=$(curl -s -H "Authorization: bearer $GISCUS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\": \"query { repository(owner:\\\"$REPO_OWNER\\\", name:\\\"$REPO_NAME\\\") { id } }\"}" \
              https://api.github.com/graphql | jq -r ".data.repository.id")

            CREATE_BODY=$(jq -n \
              --arg rid "$REPO_ID" \
              --arg cat "$CATEGORY_ID" \
              --arg title "$PATHNAME" \
              '{
                query: "mutation ($rid: ID!, $cat: ID!, $title: String!) { createDiscussion(input: {repositoryId: $rid, categoryId: $cat, title: $title, body: \"Auto-created for new blog post.\"}) { discussion { id title url } } }",
                variables: { rid: $rid, cat: $cat, title: $title }
              }'
            )

            RESPONSE=$(curl -s -H "Authorization: bearer $GISCUS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$CREATE_BODY" \
              https://api.github.com/graphql)

            echo "$RESPONSE" | jq .

            DISC_URL=$(echo "$RESPONSE" | jq -r ".data.createDiscussion.discussion.url // empty")
            if [ -n "$DISC_URL" ]; then
              echo "Created Discussion: $DISC_URL"
            else
              echo "Failed to create Discussion for $PATHNAME"
            fi
          done